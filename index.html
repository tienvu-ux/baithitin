    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      color: #333;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
      border: 3px solid white; /* Viền trắng */
    }
    /* Header: Khung màu xanh */
    header {
      background-color: #0074D9;
      padding: 20px;
      border-bottom: 3px solid white; /* Viền trắng */
    }
    header h1 {
      font-size: 32px;
      color: white;
      margin-bottom: 10px;
    }
    header p {

      color: white;
    }
    /* Main: Khung nền cam */

      background-color: #FF851B;
      padding: 20px;
      border-bottom: 3px solid white; /* Viền trắng */
    }
    /* Các khung nội dung con: nền vàng */
    .content-box {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      padding: 10px;
      border: 2px solid white; /* Viền trắng */
      background-color: #FFDC00;
    }
    .box {
      flex: 1;
      margin: 0 10px;
      padding: 20px;
      border: 2px solid white; /* Viền trắng */
      background-color: white;
      border-radius: 5px;
    }
    .box img {
      width: 100%;
      height: auto;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .box h2 {
      color: #0074D9;
      margin-bottom: 10px;
    }
    .box p {
      font-size: 16px;
    }
    /* Footer: Khung màu đỏ */
    footer {
      background-color: #D90000;
      padding: 20px;
    }
    footer p {
      color: white;
      font-size: 16px;
    }
  </style>
</head>
